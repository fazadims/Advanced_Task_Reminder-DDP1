{% for r in reminders %}
  <div id="toast-reminder-{{ r.pk }}"
       data-reminder-id="{{ r.pk }}"
       data-title="{{ r.task.title }}"
       data-message="{% if r.message %}{{ r.message }}{% elif r.checkpoint %}{{ r.checkpoint.title }}{% else %}{{ r.task.title }}{% endif %}"
       data-level="{{ r.escalation_level }}"
       data-url="{% url 'tasks:task_detail' r.task.pk %}"
       class="rounded-xl border shadow-lg p-3.5 text-xs {% if r.escalation_level == 3 %}bg-red-50 border-red-300 text-red-950{% elif r.escalation_level == 2 %}bg-amber-50 border-amber-300 text-amber-950{% else %}bg-blue-50 border-blue-300 text-blue-950{% endif %}">
    <div class="flex items-start justify-between gap-2">
      <div class="space-y-1 min-w-0">
        <span class="inline-block px-1.5 py-0.5 rounded font-bold text-[10px] uppercase {% if r.escalation_level == 3 %}bg-red-600 text-white{% elif r.escalation_level == 2 %}bg-amber-500 text-white{% else %}bg-blue-600 text-white{% endif %}">
          L{{ r.escalation_level }} · {{ r.get_escalation_level_display }}
        </span>
        <p class="font-bold text-slate-900 truncate">{{ r.task.title }}</p>
        {% if r.checkpoint %}
          <p class="text-slate-700 font-medium truncate">{{ r.checkpoint.title }}</p>
        {% endif %}
        {% if r.message %}
          <p class="text-slate-700 leading-snug">{{ r.message }}</p>
        {% endif %}
      </div>
      <button type="button"
              hx-post="{% url 'alerts:dismiss' r.pk %}"
              hx-target="#toast-reminder-{{ r.pk }}"
              hx-swap="outerHTML"
              aria-label="Dismiss alert"
              class="text-slate-400 hover:text-slate-700 font-bold px-1">&times;</button>
    </div>
    <div class="flex flex-wrap items-center gap-1.5 mt-2.5 pt-2 border-t border-black/10">
      <button type="button"
              hx-post="{% url 'alerts:snooze' r.pk %}"
              hx-vals='{"minutes": 15}'
              hx-target="#toast-reminder-{{ r.pk }}"
              hx-swap="outerHTML"
              class="px-2 py-1 rounded bg-white border border-slate-200 hover:bg-slate-100 text-slate-700 font-medium">
        Snooze 15m
      </button>
      <button type="button"
              hx-post="{% url 'alerts:done' r.pk %}"
              hx-target="#toast-reminder-{{ r.pk }}"
              hx-swap="outerHTML"
              class="px-2 py-1 rounded bg-emerald-600 hover:bg-emerald-700 text-white font-semibold">
        Done
      </button>
      <a href="{% url 'tasks:task_detail' r.task.pk %}"
         class="ml-auto text-indigo-700 hover:underline font-semibold">
        Open &rarr;
      </a>
    </div>
  </div>
{% endfor %}
