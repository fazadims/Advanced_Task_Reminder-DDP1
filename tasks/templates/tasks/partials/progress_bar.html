{% with pct=task.progress_percent %}
<div id="task-progress-bar" {% if oob %}hx-swap-oob="true"{% endif %} class="bg-white rounded-xl border border-slate-200 p-4">
  <div class="flex items-center justify-between gap-2 mb-2">
    <span class="text-sm font-semibold text-slate-700">Task Progress</span>
    <div class="flex items-center gap-2">
      <span class="px-2.5 py-0.5 rounded-full text-xs font-medium {% if task.status == 'DONE' %}bg-emerald-100 text-emerald-700{% elif task.status == 'IN_PROGRESS' %}bg-indigo-100 text-indigo-700{% elif task.status == 'ARCHIVED' %}bg-slate-200 text-slate-600{% else %}bg-amber-100 text-amber-700{% endif %}">
        {{ task.get_status_display }}
      </span>
      <span class="text-sm font-bold text-indigo-600">{{ pct }}%</span>
    </div>
  </div>
  <div class="w-full h-2.5 bg-slate-100 rounded-full overflow-hidden">
    <div class="h-full bg-indigo-600 rounded-full transition-all duration-300" style="width: {{ pct }}%"></div>
  </div>
</div>
{% endwith %}
