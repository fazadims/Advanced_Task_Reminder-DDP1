<div class="rounded-xl border border-purple-200 bg-purple-50/70 p-4 space-y-3">
  <div class="flex items-center justify-between gap-2">
    <div class="flex items-center gap-2">
      <h3 class="text-sm font-bold text-slate-900">Suggested Sub-tasks</h3>
      {% if source == "ai" %}
        <span class="px-2 py-0.5 rounded-full bg-purple-600 text-white text-[11px] font-semibold">AI Suggested</span>
      {% else %}
        <span class="px-2 py-0.5 rounded-full bg-amber-100 text-amber-800 text-[11px] font-semibold">Smart Template Fallback</span>
      {% endif %}
    </div>
    <button type="button"
            onclick="document.getElementById('ai-checkpoint-preview-box').innerHTML = ''"
            class="text-xs text-slate-500 hover:text-slate-700">
      Close
    </button>
  </div>

  <form hx-post="{% url 'tasks:apply_ai_checkpoints' task.pk %}"
        hx-target="#checkpoint-list"
        hx-swap="outerHTML"
        hx-on::after-request="if(event.detail.successful) document.getElementById('ai-checkpoint-preview-box').innerHTML = ''"
        class="space-y-2.5">
    {% csrf_token %}
    <input type="hidden" name="source" value="{{ source|default:'template' }}">

    {% for item in suggestions %}
      <div class="flex flex-col sm:flex-row sm:items-center gap-2 bg-white p-2.5 rounded-lg border border-purple-100">
        <input type="checkbox" name="selected" value="{{ forloop.counter0 }}" checked
               class="h-4 w-4 rounded border-slate-300 text-purple-600 focus:ring-purple-500">
        <input type="text" name="title_{{ forloop.counter0 }}" value="{{ item.title }}" required
               class="flex-1 rounded-md border border-slate-200 px-2.5 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-purple-500">
        <select name="phase_{{ forloop.counter0 }}"
                class="rounded-md border border-slate-200 px-2 py-1.5 text-xs bg-white focus:outline-none focus:ring-2 focus:ring-purple-500">
          <option value="RESEARCH" {% if item.phase == 'RESEARCH' %}selected{% endif %}>RESEARCH</option>
          <option value="DRAFT" {% if item.phase == 'DRAFT' %}selected{% endif %}>DRAFT</option>
          <option value="REVIEW" {% if item.phase == 'REVIEW' %}selected{% endif %}>REVIEW</option>
          <option value="SUBMIT" {% if item.phase == 'SUBMIT' %}selected{% endif %}>SUBMIT</option>
          <option value="CUSTOM" {% if item.phase == 'CUSTOM' or not item.phase %}selected{% endif %}>CUSTOM</option>
        </select>
        <div class="flex items-center gap-1">
          <input type="number" name="estimated_minutes_{{ forloop.counter0 }}" value="{{ item.estimated_minutes|default:30 }}" min="5" max="600"
                 class="w-16 rounded-md border border-slate-200 px-2 py-1.5 text-xs focus:outline-none focus:ring-2 focus:ring-purple-500">
          <span class="text-xs text-slate-500">m</span>
        </div>
      </div>
    {% empty %}
      <p class="text-xs text-slate-600">No suggestions were generated.</p>
    {% endfor %}

    {% if suggestions %}
      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="button"
                onclick="document.getElementById('ai-checkpoint-preview-box').innerHTML = ''"
                class="px-3 py-1.5 rounded-lg border border-slate-200 bg-white text-xs font-medium text-slate-700 hover:bg-slate-50">
          Cancel
        </button>
        <button type="submit"
                class="px-4 py-1.5 rounded-lg bg-purple-600 hover:bg-purple-700 text-white text-xs font-semibold transition">
          Apply Selected Checkpoints
        </button>
      </div>
    {% endif %}
  </form>
</div>
